<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Peserta — Akademi Juleha KBB</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container dashboard">
    <h2>Dashboard Peserta</h2>
    <p class="welcome">Selamat datang, <span id="namaUser">...</span></p>

    <div class="menu">
      <a href="URL_CLASSROOM" target="_blank">📚 Kelas Virtual (Google Classroom)</a>
      <a href="URL_MATERI" target="_blank">📂 Materi (Google Drive)</a>
      <a href="URL_KUIS" target="_blank">📝 Kuis (Google Forms)</a>
      <a href="URL_LOGBOOK" target="_blank">📓 Logbook Saya</a>
      <a href="URL_VIDEO" target="_blank">🎥 Unggah Video Praktik</a>
      <a href="URL_JADWAL" target="_blank">📅 Jadwal</a>
    </div>

    <button class="logout-btn" id="logoutBtn">Keluar</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    import { firebaseConfig } from "./firebase-config.js";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    onAuthStateChanged(auth, async (user) => {
      if (!user) { window.location.href = 'index.html'; return; }
      const snap = await getDoc(doc(db, "users", user.uid));
      if (!snap.exists()) { await signOut(auth); window.location.href = 'index.html'; return; }
      document.getElementById('namaUser').textContent = snap.data().nama || user.displayName;
    });

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await signOut(auth);
      window.location.href = 'index.html';
    });
  </script>
</body>
</html>
